<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Hittsumi281 — モバイルアプリの企画・開発・配信、システム開発、IT コンサルティング。"
    />
    <title>Hittsumi281</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ===== Reset & Base ===== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        -webkit-text-size-adjust: 100%;
        color-scheme: light;
      }

      body {
        font-family: 'M PLUS Rounded 1c', sans-serif;
        font-size: 15px;
        line-height: 1.8;
        color: #3d3834;
        background-color: #fafaf9;
        padding: 24px;
        max-width: 600px;
        margin: 0 auto;
        -webkit-font-smoothing: antialiased;
      }

      /* ===== Header ===== */
      header {
        text-align: center;
        margin-bottom: 32px;
      }

      h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin-bottom: 8px;
      }

      .tagline {
        font-size: 13px;
        color: #786f67;
      }

      /* ===== Sections ===== */
      h2 {
        font-size: 17px;
        font-weight: 700;
        margin-top: 32px;
        margin-bottom: 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid #e8e6e3;
      }

      p {
        margin-bottom: 12px;
      }

      ul {
        margin-bottom: 12px;
        padding-left: 1.5em;
      }

      li {
        margin-bottom: 6px;
      }

      a {
        color: #9a5568;
        text-decoration: none;
      }

      a:hover,
      a:active {
        text-decoration: underline;
      }

      /* ===== Business Info List ===== */
      dl {
        background-color: #ffffff;
        border-radius: 12px;
        padding: 16px 20px;
        margin-top: 4px;
      }

      dt {
        font-weight: 500;
        font-size: 13px;
        color: #786f67;
        margin-top: 10px;
      }

      dt:first-child {
        margin-top: 0;
      }

      dd {
        margin-left: 0;
        margin-bottom: 2px;
      }

      .duns-note {
        font-size: 12px;
        color: #786f67;
      }

      /* ===== Footer ===== */
      footer {
        text-align: center;
        color: #786f67;
        font-size: 13px;
        margin-top: 40px;
        padding-top: 20px;
        border-top: 1px solid #e8e6e3;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Hittsumi281</h1>
      <p class="tagline">モバイルアプリ・システム開発、IT コンサルティング</p>
    </header>

    <main>
      <section>
        <h2>事業者情報</h2>
        <dl>
          <dt>屋号</dt>
          <dd>
            Hittsumi281
            <span class="duns-note">（D-U-N-S 登録名: HITTSUMI281）</span>
          </dd>

          <dt>D-U-N-S Number</dt>
          <dd>699083721</dd>

          <dt>代表者</dt>
          <dd>Katsura Chiba</dd>

          <dt>所在地</dt>
          <dd>日本・神奈川県</dd>
        </dl>
      </section>

      <section>
        <h2>事業内容</h2>
        <ul>
          <li>モバイルアプリの企画・開発・配信</li>
          <li>システム開発</li>
          <li>IT コンサルティング</li>
        </ul>
      </section>

      <section>
        <h2>お問い合わせ</h2>
        <p>
          <a href="mailto:contact@hittsumi281.com">contact@hittsumi281.com</a>
        </p>
      </section>

      <section>
        <h2>関連リンク</h2>
        <ul>
          <li>
            <a
              href="https://apps.apple.com/jp/app/%E6%97%A5%E3%81%B7%E3%82%89%E3%81%99/id6759938635"
              rel="noopener noreferrer"
              target="_blank"
            >
              日ぷらす（App Store）
            </a>
          </li>
        </ul>
      </section>
    </main>

    <footer>
      <p>&copy; Hittsumi281</p>
    </footer>
  </body>
</html>
